:root{--g:#1f3a5f;--g2:#e4ebf5;--bg:#f6f4ee;--c:#fff;--t:#222;--m:#777;--o:#e08a1e;--r:#c0392b;--b:#2b6cb0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"CairoE","Cairo","Noto Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6;background:var(--bg);color:var(--t);padding-bottom:84px;font-size:16px}
header{background:linear-gradient(135deg,#1f3a5f,#2f5d95);color:#fff;padding:18px 16px 22px;border-radius:0 0 24px 24px;position:sticky;top:0;z-index:5;box-shadow:0 3px 10px #0003}
header h1{margin:0;font-size:21px}header small{opacity:.85}
main{padding:14px;max-width:720px;margin:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--c);border-radius:16px;padding:12px;text-align:center;box-shadow:0 1px 4px #0001}
.stat b{display:block;font-size:24px;color:var(--g)}.stat span{font-size:13px;color:var(--m)}
.card{background:var(--c);border-radius:16px;padding:13px;margin:10px 0;box-shadow:0 1px 4px #0001}
.card h3{margin:0 0 8px;font-size:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eee}
.row:last-child{border:0}
.tag{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--g2);color:var(--g);white-space:nowrap}
.tag.o{background:#fdeed8;color:#a45f06}.tag.r{background:#fbe0dc;color:var(--r)}.tag.b{background:#dfeafa;color:var(--b)}.tag.x{background:#eee;color:#666}
.m{color:var(--m);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;box-shadow:0 -2px 12px #0002;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:9px 2px 7px;font-size:11px;color:var(--m);font-family:inherit}
nav button i{display:block;font-style:normal;font-size:22px}
nav button.on{color:var(--g);font-weight:700}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--g);color:#fff;font-size:15px;font-family:inherit;cursor:pointer}
.btn.s{background:var(--g2);color:var(--g)}.btn.d{background:#fbe0dc;color:var(--r)}.btn.sm{padding:6px 12px;font-size:13px}
.btn.o{background:#fdeed8;color:#a45f06}
.sheet-bg{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:18px;max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:18px}
label{display:block;margin:10px 0 4px;font-size:14px;color:#444}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font-size:16px;font-family:inherit;background:#fafafa}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}
.acts .btn{padding:13px 8px;font-size:15px}
.empty{text-align:center;color:var(--m);padding:22px 10px}
.search{margin:4px 0 8px}
.chips{display:flex;gap:6px;overflow:auto;margin-bottom:6px}
.chips button{border:1px solid #ccc;background:#fff;border-radius:20px;padding:6px 13px;font-family:inherit;white-space:nowrap;cursor:pointer}
.chips .on{background:var(--g);color:#fff;border-color:var(--g)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;z-index:50}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
th,td{padding:8px 6px;border-bottom:1px solid #eee;text-align:right}
th{color:var(--m);font-weight:700;font-size:12px}
.tblwrap{overflow-x:auto;border-radius:12px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid #ccc;background:#fff;border-radius:10px;padding:9px 4px;font-family:inherit;font-size:13px;cursor:pointer}
.seg .on-p{background:var(--g2);border-color:var(--g);color:var(--g);font-weight:700}
.seg .on-a{background:#fbe0dc;border-color:var(--r);color:var(--r);font-weight:700}
.seg .on-l{background:#dfeafa;border-color:var(--b);color:var(--b);font-weight:700}
.seg .on-h{background:#fdeed8;border-color:var(--o);color:#a45f06;font-weight:700}
#printArea{display:none}
@media print{
 body>*{display:none!important}
 #printArea{display:block!important;padding:0;background:#fff}
 body{padding:0;background:#fff}
 table{font-size:12px}
 th,td{border:1px solid #999;padding:6px}
}

header{padding-top:calc(18px + env(safe-area-inset-top))}a{color:inherit}.row{cursor:pointer}
</style></head><body>
<header><h1 id="coName">مكتب المحاماة</h1><small>قضايا · جلسات · عملاء · أتعاب</small></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="sheet"></div>
<div id="printArea"></div>
<script>
"use strict";
const KEY='lawoffice.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ld=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>ld(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ld(d)};
const thisMonth=()=>today().slice(0,7);
const fmt=n=>{n=Math.round((+n||0)*100)/100;return n.toLocaleString('en-US',{maximumFractionDigits:2})};
const cur=()=>S.office.cur||'ج.م';
const money=n=>fmt(n)+' '+cur();
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const mName=m=>{const[y,mm]=m.split('-');return MONTHS[+mm-1]+' '+y};
const dName=s=>s?DAYS[new Date(s+'T12:00:00').getDay()]+' '+s.split('-').reverse().join('/'):'';
const CST={open:['جارية','b'],appeal:['استئناف','o'],won:['كسبنا','g'],lost:['خسرنا','r'],settled:['صلح','x'],closed:['مقفولة','x']};
const CTYPE=['مدني','جنائي','أسرة / أحوال شخصية','تجاري','عمالي','إداري','إيجارات','عقارات','جنح','شركات','أخرى'];
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.office)S={office:{name:'مكتب المحاماة',cur:'ج.م',lawyer:''},clients:[],cases:[],sessions:[],pays:[],tasks:[],notes:[]};
['clients','cases','sessions','pays','tasks','notes'].forEach(k=>S[k]=S[k]||[]);
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
let TAB='home',CF='all',Q='';
const TABS=[['home','🏠','الرئيسية'],['cases','⚖️','القضايا'],['sess','📅','الجلسات'],['cli','👥','العملاء'],['acc','💰','الحسابات'],['more','⚙️','المزيد']];
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function openSheet(h){$('#sheet').innerHTML='<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet">'+h+'</div></div>'}
function closeSheet(){$('#sheet').innerHTML=''}
const client=id=>S.clients.find(c=>c.id===id);
const kase=id=>S.cases.find(c=>c.id===id);
const cName=id=>client(id)?.name||'—';
const kTitle=id=>{const c=kase(id);return c?(c.title||'قضية')+(c.no?' ('+c.no+(c.year?'/'+c.year:'')+')':''):'بدون قضية'};
function renderNav(){$('#nav').innerHTML=TABS.map(t=>`<button class="${TAB===t[0]?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</button>`).join('')}
function go(t){TAB=t;Q='';render();scrollTo(0,0)}
function render(){
 $('#coName').textContent=S.office.name||'مكتب المحاماة';
 renderNav();
 $('#app').innerHTML=({home:vHome,cases:vCases,sess:vSess,cli:vCli,acc:vAcc,more:vMore})[TAB]();
}
/* ---- generic form ---- */
let FORM=null;
function form(title,fields,vals,onSave,extra){
 FORM={fields,onSave};vals=vals||{};
 openSheet(`<h2>${title}</h2>`+fields.map(f=>{
  const v=vals[f.k]??f.d??'';
  let i;
  if(f.t==='select')i=`<select id="f_${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
  else if(f.t==='area')i=`<textarea id="f_${f.k}" rows="3">${esc(v)}</textarea>`;
  else i=`<input id="f_${f.k}" type="${f.t||'text'}" ${f.t==='number'?'inputmode="decimal" step="any"':''} value="${esc(v)}">`;
  return `<label>${f.l}</label>${i}`}).join('')+
  `<div class="acts"><button class="btn" onclick="formSave()">حفظ</button><button class="btn s" onclick="closeSheet()">إلغاء</button></div>${extra||''}`);
}
function formSave(){
 const o={};for(const f of FORM.fields){let v=$('#f_'+f.k).value.trim();if(f.t==='number')v=+v||0;o[f.k]=v}
 const r=FORM.onSave(o);if(r===false)return;save();closeSheet();render();toast('اتحفظ ✅');
}
function confirmDel(msg,fn){if(confirm(msg)){fn();save();closeSheet();render()}}
/* ---- hesabat ---- */
const feeOf=id=>S.cases.filter(c=>c.clientId===id).reduce((s,c)=>s+(+c.fee||0),0)+S.pays.filter(p=>p.clientId===id&&p.kind==='fee').reduce((s,p)=>s+p.amount,0);
const expOf=id=>S.pays.filter(p=>p.clientId===id&&p.kind==='exp'&&p.bill).reduce((s,p)=>s+p.amount,0);
const paidOf=id=>S.pays.filter(p=>p.clientId===id&&p.kind==='in').reduce((s,p)=>s+p.amount,0);
const balOf=id=>feeOf(id)+expOf(id)-paidOf(id);
const caseFee=id=>(+(kase(id)?.fee)||0)+S.pays.filter(p=>p.caseId===id&&p.kind==='fee').reduce((s,p)=>s+p.amount,0);
const caseBill=id=>S.pays.filter(p=>p.caseId===id&&p.kind==='exp'&&p.bill).reduce((s,p)=>s+p.amount,0);
const casePaid=id=>S.pays.filter(p=>p.caseId===id&&p.kind==='in').reduce((s,p)=>s+p.amount,0);
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const PK=p=>p.kind==='in'?'💵 دفعة':p.kind==='fee'?'📋 أتعاب':p.kind==='exp'?(p.bill?'🧾 مصروف (على العميل)':'🧾 مصروف'):'🧾 مصروف مكتب';
function sessLabel(s){return `${dName(s.date)}${s.time?' · '+s.time:''}`}
function upcoming(){return S.sessions.filter(s=>!s.done&&s.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}
function overdueS(){return S.sessions.filter(s=>!s.done&&s.date<today()).sort((a,b)=>a.date.localeCompare(b.date))}
function waLink(phone,text){let p=String(phone||'').replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);else if(p.startsWith('0'))p='20'+p.slice(1);return 'https://wa.me/'+p+'?text='+encodeURIComponent(text)}
/* ---- home ---- */
function sessRow(s,showDone){
 const k=kase(s.caseId);
 return `<div class="row" onclick="sessView('${s.id}')"><div><b>${esc(kTitle(s.caseId))}</b><div class="m">${esc(cName(k?.clientId))} · ${esc(s.court||k?.court||'')}</div></div><span class="tag ${s.date<today()?'r':s.date===today()?'o':'b'}">${s.date===today()?'النهاردة':s.date===addDays(today(),1)?'بكره':dName(s.date)}${s.time?' '+s.time:''}</span></div>`;
}
function vHome(){
 const t=today(),up=upcoming(),td=up.filter(s=>s.date===t),tm=up.filter(s=>s.date===addDays(t,1)),wk=up.filter(s=>s.date>addDays(t,1)&&s.date<=addDays(t,7)),od=overdueS();
 const open=S.cases.filter(c=>c.status==='open'||c.status==='appeal').length;
 const debt=sum(S.clients,c=>Math.max(0,balOf(c.id)));
 const tasks=S.tasks.filter(x=>!x.done).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')).slice(0,6);
 return `<div class="grid">
 <div class="stat"><b>${open}</b><span>قضية جارية</span></div>
 <div class="stat"><b>${td.length}</b><span>جلسات النهاردة</span></div>
 <div class="stat"><b>${fmt(debt)}</b><span>أتعاب متبقية ${esc(cur())}</span></div>
 <div class="stat"><b>${S.clients.length}</b><span>عميل</span></div></div>
 <div class="card"><h3>إجراءات سريعة</h3><div class="acts">
 <button class="btn" onclick="sessForm()">📅 جلسة جديدة</button>
 <button class="btn s" onclick="caseForm()">⚖️ قضية جديدة</button>
 <button class="btn s" onclick="cliForm()">👤 عميل جديد</button>
 <button class="btn s" onclick="payForm('in')">💵 دفعة أتعاب</button></div></div>
 ${od.length?`<div class="card"><h3>⚠️ جلسات عدّت ومحتاجة قرار/نتيجة</h3>${od.slice(0,8).map(s=>sessRow(s)).join('')}</div>`:''}
 <div class="card"><h3>جلسات النهاردة</h3>${td.length?td.map(s=>sessRow(s)).join(''):'<div class="empty">مفيش جلسات النهاردة</div>'}</div>
 ${tm.length?`<div class="card"><h3>بكره</h3>${tm.map(s=>sessRow(s)).join('')}</div>`:''}
 ${wk.length?`<div class="card"><h3>الأسبوع الجاي</h3>${wk.map(s=>sessRow(s)).join('')}</div>`:''}
 <div class="card"><h3>المهام</h3>${tasks.length?tasks.map(taskRow).join(''):'<div class="empty">مفيش مهام</div>'}<button class="btn s sm" onclick="taskForm()">➕ مهمة</button></div>`;
}
function taskRow(x){return `<div class="row"><label style="display:flex;gap:8px;margin:0;align-items:center;flex:1"><input type="checkbox" style="width:22px" ${x.done?'checked':''} onchange="taskToggle('${x.id}')"><span style="${x.done?'text-decoration:line-through;color:#999':''}">${esc(x.title)}<div class="m">${x.caseId?esc(kTitle(x.caseId))+' · ':''}${x.due?dName(x.due):''}</div></span></label><button class="btn sm d" onclick="taskDel('${x.id}')">🗑</button></div>`}
function taskToggle(id){const x=S.tasks.find(t=>t.id===id);x.done=!x.done;save();render()}
function taskDel(id){if(confirm('تمسح المهمة؟')){S.tasks=S.tasks.filter(t=>t.id!==id);save();render()}}
function taskForm(caseId){
 form('مهمة جديدة',[{k:'title',l:'المهمة'},{k:'due',l:'الموعد',t:'date'},{k:'caseId',l:'القضية',t:'select',o:[['','بدون'],...S.cases.map(c=>[c.id,kTitle(c.id)])],d:caseId||''}],{},o=>{if(!o.title)return false;S.tasks.push({id:uid(),...o,done:false})});
}
/* ---- cases ---- */
function vCases(){
 const chips=[['all','الكل'],['open','جارية'],['appeal','استئناف'],['won','كسبنا'],['lost','خسرنا'],['closed','مقفولة']];
 let l=S.cases.filter(c=>CF==='all'||c.status===CF||(CF==='closed'&&['closed','settled'].includes(c.status)));
 if(Q)l=l.filter(c=>[c.title,c.no,c.court,c.opponent,cName(c.clientId)].join(' ').includes(Q));
 return `<button class="btn" style="width:100%" onclick="caseForm()">➕ قضية جديدة</button>
 <input class="search" placeholder="🔍 بحث برقم القضية أو الاسم أو المحكمة" value="${esc(Q)}" oninput="Q=this.value;listUpd()">
 <div class="chips">${chips.map(c=>`<button class="${CF===c[0]?'on':''}" onclick="CF='${c[0]}';render()">${c[1]}</button>`).join('')}</div>
 <div id="lst">${casesList(l)}</div>`;
}
function casesList(l){return l.length?l.map(c=>{const st=CST[c.status]||CST.open;const nx=S.sessions.filter(s=>s.caseId===c.id&&!s.done&&s.date>=today()).sort((a,b)=>a.date.localeCompare(b.date))[0];
 return `<div class="card" onclick="caseView('${c.id}')"><div class="row" style="border:0;padding:0"><b>${esc(c.title||'قضية')}</b><span class="tag ${st[1]==='g'?'':st[1]}">${st[0]}</span></div>
 <div class="m">${c.no?'رقم '+esc(c.no)+(c.year?'/'+esc(c.year):'')+' · ':''}${esc(c.court||'')} · ${esc(cName(c.clientId))}</div>${nx?`<div class="m">الجلسة الجاية: ${sessLabel(nx)}</div>`:''}</div>`}).join(''):'<div class="empty">مفيش قضايا</div>'}
function listUpd(){
 if(TAB==='cases'){let l=S.cases.filter(c=>CF==='all'||c.status===CF||(CF==='closed'&&['closed','settled'].includes(c.status)));if(Q)l=l.filter(c=>[c.title,c.no,c.court,c.opponent,cName(c.clientId)].join(' ').includes(Q));$('#lst').innerHTML=casesList(l)}
 else if(TAB==='cli'){$('#lst').innerHTML=cliList()}
}
function caseForm(id){
 if(!S.clients.length&&!id){toast('ضيف عميل الأول');return cliForm()}
 const c=id?kase(id):{};
 form(id?'تعديل قضية':'قضية جديدة',[
 {k:'clientId',l:'العميل',t:'select',o:S.clients.map(x=>[x.id,x.name])},
 {k:'title',l:'عنوان / موضوع القضية'},
 {k:'no',l:'رقم القضية'},{k:'year',l:'السنة',t:'number'},
 {k:'type',l:'النوع',t:'select',o:CTYPE.map(x=>[x,x])},
 {k:'court',l:'المحكمة'},{k:'circuit',l:'الدائرة'},
 {k:'opponent',l:'الخصم'},{k:'oppLawyer',l:'محامي الخصم'},
 {k:'role',l:'صفة العميل',t:'select',o:[['مدعي','مدعي'],['مدعى عليه','مدعى عليه'],['متهم','متهم'],['مجني عليه','مجني عليه'],['أخرى','أخرى']]},
 {k:'status',l:'الحالة',t:'select',o:Object.entries(CST).map(([k,v])=>[k,v[0]])},
 {k:'fee',l:'الأتعاب المتفق عليها',t:'number'},
 {k:'openDate',l:'تاريخ فتح القضية',t:'date',d:today()},
 {k:'notes',l:'ملاحظات',t:'area'}],c,o=>{
 if(!o.title&&!o.no)return false;
 if(id)Object.assign(kase(id),o);else{S.cases.push({id:uid(),...o})}
 });
}
function caseView(id){
 const c=kase(id);if(!c)return;const st=CST[c.status]||CST.open;
 const ss=S.sessions.filter(s=>s.caseId===id).sort((a,b)=>b.date.localeCompare(a.date));
 const ps=S.pays.filter(p=>p.caseId===id).sort((a,b)=>b.date.localeCompare(a.date));
 const ns=S.notes.filter(n=>n.caseId===id),ts=S.tasks.filter(t=>t.caseId===id);
 const fee=caseFee(id),paid=casePaid(id),exp=sum(ps.filter(p=>p.kind==='exp'),p=>p.amount),bill=caseBill(id);
 openSheet(`<h2>${esc(c.title||'قضية')} <span class="tag ${st[1]==='g'?'':st[1]}">${st[0]}</span></h2>
 <div class="m">${c.no?'رقم '+esc(c.no)+(c.year?'/'+esc(c.year):'')+' · ':''}${esc(c.type||'')}</div>
 <div class="card"><div class="row"><span>العميل</span><b onclick="cliView('${c.clientId}')">${esc(cName(c.clientId))}</b></div>
 ${c.role?`<div class="row"><span>الصفة</span><b>${esc(c.role)}</b></div>`:''}
 <div class="row"><span>المحكمة / الدائرة</span><b>${esc(c.court||'—')} ${c.circuit?'/ '+esc(c.circuit):''}</b></div>
 <div class="row"><span>الخصم</span><b>${esc(c.opponent||'—')}</b></div>
 ${c.oppLawyer?`<div class="row"><span>محامي الخصم</span><b>${esc(c.oppLawyer)}</b></div>`:''}
 ${c.notes?`<div class="m" style="padding-top:6px">${esc(c.notes)}</div>`:''}</div>
 <div class="card"><h3>الأتعاب</h3><div class="row"><span>المتفق عليه</span><b>${money(fee)}</b></div><div class="row"><span>المدفوع</span><b>${money(paid)}</b></div>${bill?`<div class="row"><span>مصروفات على العميل</span><b>${money(bill)}</b></div>`:''}<div class="row"><span>المتبقي</span><b style="color:${fee+bill-paid>0?'var(--r)':'var(--g)'}">${money(fee+bill-paid)}</b></div>${exp?`<div class="row"><span>إجمالي مصروفات القضية</span><b>${money(exp)}</b></div>`:''}
 <div class="acts"><button class="btn sm" onclick="payForm('in','${id}')">💵 دفعة</button><button class="btn sm s" onclick="payForm('fee','${id}')">📋 أتعاب</button><button class="btn sm s" onclick="payForm('exp','${id}')">🧾 مصروف</button></div>
 ${ps.map(p=>`<div class="row" onclick="payEdit('${p.id}')"><span>${PK(p)} · ${p.date.split('-').reverse().join('/')}<div class="m">${esc(p.note||'')}</div></span><b>${money(p.amount)}</b></div>`).join('')}</div>
 <div class="card"><h3>الجلسات</h3><button class="btn sm" onclick="sessForm('${id}')">➕ جلسة</button>
 ${ss.map(s=>`<div class="row" onclick="sessView('${s.id}')"><span>${sessLabel(s)}<div class="m">${esc(s.result||s.note||'')}</div></span><span class="tag ${s.done?'x':'b'}">${s.done?'تمت':'جاية'}</span></div>`).join('')||'<div class="empty">لا جلسات</div>'}</div>

 doPrint(`<h2>تقرير ${mName(m)} - ${esc(S.office.name)}</h2><table><tr><th>التاريخ</th><th>البيان</th><th>إيراد</th><th>مصروف</th></tr>${mo.map(p=>`<tr><td>${p.date}</td><td>${esc(p.kind==='in'?cName(p.clientId)+' '+(p.note||''):p.note||'مصروف')}</td><td>${p.kind==='in'?fmt(p.amount):''}</td><td>${p.kind!=='in'?fmt(p.amount):''}</td></tr>`).join('')}</table><h3>الإيرادات ${money(i)} · المصروفات ${money(e)} · الصافي ${money(i-e)}</h3>`)}
function rptDebt(){const d=S.clients.filter(c=>balOf(c.id)>0);doPrint(`<h2>المتأخرات - ${esc(S.office.name)}</h2><table><tr><th>العميل</th><th>التليفون</th><th>الأتعاب</th><th>المدفوع</th><th>المتبقي</th></tr>${d.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone||'')}</td><td>${fmt(feeOf(c.id)+expOf(c.id))}</td><td>${fmt(paidOf(c.id))}</td><td>${fmt(balOf(c.id))}</td></tr>`).join('')}</table><h3>الإجمالي ${money(sum(d,c=>balOf(c.id)))}</h3>`)}
render();notifyNow();
